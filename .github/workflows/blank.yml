[app]
title = LallaFatima AI
package.name = LallaFatimaAI
package.domain = ai.lallafatima
source.dir = app
source.include_exts = py,html,json
version = 0.2.0
requirements = python3,kivy,requests
orientation = portrait

# Owner branding — appears in Android app info
app.name = LallaFatima AI
